<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive graphs</title>

    <style>
        :root {
            --text: #333;
            --muted: #777;
            --border: #ccc;
            --background: #fff;
            --graph-background: #fafafa;

            --word-background: #fff;
            --word-border: #bbb;

            --selected-background: #d9f5df;
            --selected-border: #35a853;

            --bar: #4c78a8;
            --bar-hover: #357abd;

            --bar-highlight: #e45756;
            --bar-highlight-hover: #c63d3d;
        }


        @media (prefers-color-scheme: dark) {

            :root {
                --text: #ddd;
                --muted: #999;
                --border: #444;
                --background: #1e1e1e;
                --graph-background: #252525;

                --word-background: #2b2b2b;
                --word-border: #555;

                --selected-background: #193d24;
                --selected-border: #4caf68;

                --bar: #7aa6d8;
                --bar-hover: #9bc4eb;

                --bar-highlight: #ff7b72;
                --bar-highlight-hover: #ff9b94;
            }

        }

        .bar.highlighted {
            fill: var(--bar-highlight);
        }

        .bar.highlighted:hover {
            fill: var(--bar-highlight-hover);
        }


        body {
            margin: 0;
            /* padding: 20px; */

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Google Sans",
                sans-serif;

            font-size: 16px;
            line-height: 1.7;

            color: var(--text);
        }


        /* =====================================================
           SENTENCE
           ===================================================== */

        .sentence {
            margin-bottom: 30px;
        }


        /* =====================================================
           WORD BUTTONS
           ===================================================== */

        .graph-word {

            display: inline-block;

            margin: 2px 3px;
            padding: 0px 5px;

            border: 1px solid var(--word-border);
            border-radius: 5px;

            background: var(--word-background);

            color: var(--text);

            cursor: pointer;

            user-select: none;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                color 0.15s ease,
                transform 0.1s ease;
        }


        .graph-word:hover {
            border-color: var(--selected-border);
        }


        .graph-word:active {
            transform: scale(0.97);
        }


        /*
         * SELECTED WORD
         */

        .graph-word.selected {

            background: var(--selected-background);

            border-color: var(--selected-border);

            color: var(--selected-border);

            /* font-weight: 600; */

        }


        /* =====================================================
           GRAPH
           ===================================================== */

        .graph-container {

            margin-top: 15px;
            margin-bottom: 30px;

            padding: 15px;

            border: 1px solid var(--border);
            border-radius: 5px;

            background: var(--graph-background);

            overflow-x: auto;
            overflow-y: hidden;
        }


        .graph-title {

            font-size: 15px;
            font-weight: 600;

            margin-bottom: 10px;

        }


        .graph-svg {

            width: 100%;
            min-width: 500px;

            /* height: 430px; */

            display: block;

        }

        /* =====================================================
   GRAPH CONTROLS
   ===================================================== */

        .graph-controls {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 12px;

            font-size: 13px;
        }

        .graph-control {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .graph-control input[type="number"] {
            width: 65px;

            padding: 3px 6px;

            border: 1px solid var(--border);
            border-radius: 5px;

            background: var(--word-background);
            color: var(--text);
        }

        .graph-control input[type="checkbox"] {
            cursor: pointer;
        }

        .graph-control button {
            padding: 3px 8px;

            border: 1px solid var(--border);
            border-radius: 5px;

            background: var(--word-background);
            color: var(--text);

            cursor: pointer;
        }

        /* =====================================================
           AXES
           ===================================================== */

        .axis {

            stroke: var(--muted);
            stroke-width: 1;

        }


        .grid {

            stroke: var(--border);
            stroke-width: 1;

        }


        .axis-label {

            fill: var(--muted);
            font-size: 12px;

        }


        /* =====================================================
           BAR
           ===================================================== */

        .bar {

            fill: var(--bar);

            cursor: pointer;

            transition:
                fill 0.12s ease,
                opacity 0.12s ease;

        }


        .bar:hover {

            fill: var(--bar-hover);

        }


        /* =====================================================
           TOOLTIP
           ===================================================== */

        .tooltip {

            position: fixed;

            display: none;

            padding: 7px 10px;

            border-radius: 6px;

            background: var(--background);

            border: 1px solid var(--border);

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.25);

            font-size: 12px;

            line-height: 1.4;

            pointer-events: none;

            z-index: 9999;

            white-space: nowrap;

        }
    </style>

</head>

    <script>

       

        const svgNS =
            "http://www.w3.org/2000/svg";


        /*
         * =====================================================
         * TOOLTIP
         * =====================================================
         */

        const tooltip =
            document.createElement("div");

        tooltip.className =
            "tooltip";

        document.body.appendChild(
            tooltip
        );


        /*
         * =====================================================
         * SVG HELPER
         * =====================================================
         */

        function createSVGElement(name) {

            return document.createElementNS(
                svgNS,
                name
            );

        }


        /*
         * =====================================================
         * BARPLOT
         * =====================================================
         */

        function drawBarPlot(graph, container) {

            container.innerHTML = "";


            /*
             * =====================================================
             * TITLE
             * =====================================================
             */

            const title =
                document.createElement("div");

            title.className =
                "graph-title";

            title.textContent =
                graph.title || "Bar plot";

            container.appendChild(title);


            /*
             * =====================================================
             * CONTROLS
             * =====================================================
             */

            const controls =
                document.createElement("div");

            controls.className =
                "graph-controls";


            /*
             * LOG SCALE
             */

            const logLabel =
                document.createElement("label");

            logLabel.className =
                "graph-control";


            const logCheckbox =
                document.createElement("input");

            logCheckbox.type =
                "checkbox";

            logCheckbox.checked =
                graph.logScale || false;


            const logText =
                document.createElement("span");

            logText.textContent =
                "Log scale";


            logLabel.appendChild(
                logCheckbox
            );

            logLabel.appendChild(
                logText
            );


            /*
             * TOP N
             */

            const topLabel =
                document.createElement("label");

            topLabel.className =
                "graph-control";


            const topText =
                document.createElement("span");

            topText.textContent =
                "Top N:";


            const topInput =
                document.createElement("input");

            topInput.type =
                "number";

            topInput.min =
                "1";

            topInput.max =
                graph.x.length;

            topInput.placeholder =
                "all";


            topLabel.appendChild(
                topText
            );

            topLabel.appendChild(
                topInput
            );


            controls.appendChild(
                logLabel
            );

            controls.appendChild(
                topLabel
            );


            container.appendChild(
                controls
            );


            /*
             * =====================================================
             * GRAPH AREA
             * =====================================================
             */

            const graphArea =
                document.createElement("div");

            graphArea.className =
                "graph-area";

            container.appendChild(
                graphArea
            );


            /*
             * =====================================================
             * HIGHLIGHT DATA
             * =====================================================
             *
             * Например:
             *
             * highlight: [
             *     331,
             *     504,
             *     7786
             * ]
             *
             * Сравниваем именно с X.
             */

            const highlightIndices =
                graph.highlight || [];


            /*
             * =====================================================
             * RENDER
             * =====================================================
             */

            function render() {

                graphArea.innerHTML = "";


                /*
                 * ================================================
                 * СОБИРАЕМ X/Y В ОБЪЕКТЫ
                 * ================================================
                 */

                let data =
                    graph.x.map(
                        (xValue, i) => ({

                            x: xValue,

                            y: graph.y[i]

                        })
                    );


                /*
                 * ================================================
                 * TOP N
                 * ================================================
                 *
                 * Берём N самых больших Y.
                 */

                const topN =
                    parseInt(
                        topInput.value
                    );


                if (
                    !isNaN(topN) &&
                    topN > 0 &&
                    topN < data.length
                ) {

                    data =
                        [...data]
                            .sort(
                                (a, b) =>
                                    b.y - a.y
                            )
                            .slice(
                                0,
                                topN
                            );

                }


                /*
                 * ================================================
                 * X / Y ПОСЛЕ TOP N
                 * ================================================
                 */

                const x =
                    data.map(
                        d => d.x
                    );


                const y =
                    data.map(
                        d => d.y
                    );


                if (x.length === 0) {

                    return;

                }


                /*
                 * ================================================
                 * LOG SCALE
                 * ================================================
                 */

                const useLog =
                    logCheckbox.checked;


                /*
                 * Для логарифмической шкалы
                 * нужны положительные значения.
                 */

                const transformedY =
                    y.map(value => {

                        if (useLog) {

                            return value > 0
                                ? Math.log10(value)
                                : 0;

                        }

                        return value;

                    });


                /*
                 * ================================================
                 * MAX Y
                 * ================================================
                 */

                const maxY =
                    Math.max(
                        ...transformedY,
                        0
                    );


                if (maxY <= 0) {

                    graphArea.textContent =
                        "Нет положительных значений для отображения.";

                    return;

                }


                /*
                 * ================================================
                 * SVG
                 * ================================================
                 */

                const svg =
                    createSVGElement(
                        "svg"
                    );

                svg.classList.add(
                    "graph-svg"
                );


                const width = 1000;
                const height = 430;


                const margin = {

                    left: 70,
                    right: 25,
                    top: 25,
                    bottom: 100

                };


                const plotWidth =
                    width -
                    margin.left -
                    margin.right;


                const plotHeight =
                    height -
                    margin.top -
                    margin.bottom;


                svg.setAttribute(
                    "viewBox",
                    `0 0 ${width} ${height}`
                );


                /*
                 * ================================================
                 * Y SCALE
                 * ================================================
                 */

                function scaleY(value) {

                    return (
                        margin.top +
                        plotHeight -
                        (
                            value / maxY
                        ) *
                        plotHeight
                    );

                }


                /*
                 * ================================================
                 * GRID + Y LABELS
                 * ================================================
                 */

                const gridCount = 5;


                for (
                    let i = 0;
                    i <= gridCount;
                    i++
                ) {

                    const fraction =
                        i / gridCount;


                    const transformedValue =
                        maxY *
                        (1 - fraction);


                    const yy =
                        scaleY(
                            transformedValue
                        );


                    /*
                     * GRID LINE
                     */

                    const line =
                        createSVGElement(
                            "line"
                        );


                    line.setAttribute(
                        "x1",
                        margin.left
                    );

                    line.setAttribute(
                        "x2",
                        width - margin.right
                    );

                    line.setAttribute(
                        "y1",
                        yy
                    );

                    line.setAttribute(
                        "y2",
                        yy
                    );


                    line.classList.add(
                        "grid"
                    );


                    svg.appendChild(
                        line
                    );


                    /*
                     * Y VALUE
                     */

                    const label =
                        createSVGElement(
                            "text"
                        );


                    let labelValue;


                    if (useLog) {

                        labelValue =
                            Math.pow(
                                10,
                                transformedValue
                            );

                    } else {

                        labelValue =
                            transformedValue;

                    }


                    label.textContent =
                        formatNumber(
                            labelValue
                        );


                    label.setAttribute(
                        "x",
                        margin.left - 10
                    );

                    label.setAttribute(
                        "y",
                        yy + 4
                    );

                    label.setAttribute(
                        "text-anchor",
                        "end"
                    );


                    label.classList.add(
                        "axis-label"
                    );


                    svg.appendChild(
                        label
                    );

                }


                /*
                 * ================================================
                 * BAR WIDTH
                 * ================================================
                 */

                const slotWidth =
                    plotWidth / x.length;


                const barWidth =
                    Math.max(
                        4,
                        slotWidth * 0.7
                    );


                /*
                 * ================================================
                 * BARS
                 * ================================================
                 */

                for (
                    let i = 0;
                    i < x.length;
                    i++
                ) {

                    const centerX =
                        margin.left +
                        (i + 0.5) *
                        slotWidth;


                    const barValue =
                        transformedY[i];


                    const barHeight =
                        plotHeight *
                        barValue /
                        maxY;


                    const barY =
                        margin.top +
                        plotHeight -
                        barHeight;


                    /*
                     * BAR
                     */

                    const rect =
                        createSVGElement(
                            "rect"
                        );


                    rect.setAttribute(
                        "x",
                        centerX -
                        barWidth / 2
                    );


                    rect.setAttribute(
                        "y",
                        barY
                    );


                    rect.setAttribute(
                        "width",
                        barWidth
                    );


                    rect.setAttribute(
                        "height",
                        barHeight
                    );


                    rect.classList.add(
                        "bar"
                    );


                    /*
                     * ============================================
                     * HIGHLIGHT
                     * ============================================
                     *
                     * Проверяем X.
                     */

                    if (
                        highlightIndices.includes(
                            x[i]
                        )
                    ) {

                        rect.classList.add(
                            "highlighted"
                        );

                    }


                    /*
                     * ============================================
                     * TOOLTIP
                     * ============================================
                     */

                    rect.addEventListener(
                        "mouseenter",
                        event => {

                            tooltip.innerHTML = `
                        <strong>x:</strong>
                        ${x[i]}
                        <br>
                        <strong>y:</strong>
                        ${formatNumber(
                                y[i],
                                4
                            )}
                    `;


                            tooltip.style.display =
                                "block";


                            updateTooltipPosition(
                                event
                            );

                        }
                    );


                    rect.addEventListener(
                        "mousemove",
                        event => {

                            updateTooltipPosition(
                                event
                            );

                        }
                    );


                    rect.addEventListener(
                        "mouseleave",
                        () => {

                            tooltip.style.display =
                                "none";

                        }
                    );


                    svg.appendChild(
                        rect
                    );


                    /*
                     * ============================================
                     * X LABEL
                     * ============================================
                     */

                    const label =
                        createSVGElement(
                            "text"
                        );


                    label.textContent =
                        x[i];


                    const labelX =
                        centerX;


                    const labelY =
                        margin.top +
                        plotHeight +
                        15;


                    label.setAttribute(
                        "x",
                        labelX
                    );


                    label.setAttribute(
                        "y",
                        labelY
                    );


                    /*
                     * ПОВОРОТ НА 90°
                     */

                    label.setAttribute(
                        "transform",
                        `rotate(
                    90
                    ${labelX}
                    ${labelY}
                )`
                    );


                    label.setAttribute(
                        "text-anchor",
                        "start"
                    );


                    label.classList.add(
                        "axis-label"
                    );


                    svg.appendChild(
                        label
                    );

                }


                /*
                 * ================================================
                 * X AXIS
                 * ================================================
                 */

                const axis =
                    createSVGElement(
                        "line"
                    );


                axis.setAttribute(
                    "x1",
                    margin.left
                );

                axis.setAttribute(
                    "x2",
                    width - margin.right
                );

                axis.setAttribute(
                    "y1",
                    margin.top +
                    plotHeight
                );

                axis.setAttribute(
                    "y2",
                    margin.top +
                    plotHeight
                );


                axis.classList.add(
                    "axis"
                );


                svg.appendChild(
                    axis
                );


                /*
                 * ================================================
                 * ADD SVG
                 * ================================================
                 */

                graphArea.appendChild(
                    svg
                );

            }


            /*
             * =====================================================
             * EVENTS
             * =====================================================
             */

            logCheckbox.addEventListener(
                "change",
                render
            );


            topInput.addEventListener(
                "input",
                render
            );


            /*
             * =====================================================
             * INITIAL RENDER
             * =====================================================
             */

            render();

        }
        /*
         * =====================================================
         * NUMBER FORMAT
         * =====================================================
         */

        function formatNumber(
            value,
            decimals = 0
        ) {

            return Number(value)
                .toFixed(decimals)
                .replace(
                    /\.?0+$/,
                    ""
                );

        }


        /*
         * =====================================================
         * TOOLTIP POSITION
         * =====================================================
         */

        function updateTooltipPosition(
            event
        ) {

            const offset = 12;

            let left =
                event.clientX +
                offset;

            let top =
                event.clientY +
                offset;


            /*
             * Не даём tooltip
             * выйти за правую границу
             */

            const rect =
                tooltip.getBoundingClientRect();


            if (
                left + rect.width >
                window.innerWidth
            ) {

                left =
                    event.clientX -
                    rect.width -
                    offset;

            }


            /*
             * Не даём tooltip
             * выйти за нижнюю границу
             */

            if (
                top + rect.height >
                window.innerHeight
            ) {

                top =
                    event.clientY -
                    rect.height -
                    offset;

            }


            tooltip.style.left =
                left + "px";


            tooltip.style.top =
                top + "px";

        }



        /*
         * =====================================================
         * CLICK HANDLERS
         * =====================================================
         */

        document
            .querySelectorAll(".graph-word")
            .forEach(word => {

                word.addEventListener("click", () => {

                    const id =
                        word.dataset.graph;

                    const graph =
                        graphs[id];


                    /*
                     * Если данных для слова нет
                     */

                    if (!graph) {

                        console.warn(
                            `Graph "${id}" not found`
                        );

                        return;

                    }


                    /*
                     * Находим предложение,
                     * которому принадлежит слово
                     */

                    const sentence =
                        word.closest(".sentence");


                    /*
                     * Находим текущее выбранное слово
                     */

                    const selected =
                        sentence.querySelector(
                            ".graph-word.selected"
                        );


                    /*
                     * Находим существующий график
                     */

                    let container =
                        sentence.querySelector(
                            ".graph-container"
                        );


                    /*
                     * =================================================
                     * СЛУЧАЙ 1:
                     * Нажали на уже выбранное слово
                     *
                     * Закрываем график.
                     * =================================================
                     */

                    if (selected === word) {

                        if (container) {
                            container.remove();
                        }

                        word.classList.remove(
                            "selected"
                        );

                        return;

                    }


                    /*
                     * =================================================
                     * СЛУЧАЙ 2:
                     * Нажали на другое слово
                     *
                     * Снимаем старый selected.
                     * =================================================
                     */

                    if (selected) {

                        selected.classList.remove(
                            "selected"
                        );

                    }


                    /*
                     * =================================================
                     * Выбираем новое слово
                     * =================================================
                     */

                    word.classList.add(
                        "selected"
                    );


                    /*
                     * =================================================
                     * Если графика ещё нет —
                     * создаём контейнер.
                     * =================================================
                     */

                    if (!container) {

                        container =
                            document.createElement(
                                "div"
                            );

                        container.className =
                            "graph-container";


                        sentence.appendChild(
                            container
                        );

                    }


                    /*
                     * =================================================
                     * Перерисовываем существующий график
                     *
                     * Важно:
                     * container НЕ удаляется.
                     *
                     * drawBarPlot() сам очистит
                     * его содержимое и нарисует
                     * новый график.
                     * =================================================
                     */

                    drawBarPlot(
                        graph,
                        container
                    );

                });

            });

            document
    .querySelectorAll(".sentence")
    .forEach(sentence => {

        const defaultWord =
            sentence.dataset.defaultWord;

        if (!defaultWord) {
            return;
        }

        const word =
            sentence.querySelector(
                `.graph-word[data-graph="${defaultWord}"]`
            );

        if (!word) {
            return;
        }

        const graph =
            graphs[defaultWord];

        if (!graph) {
            console.warn(
                `Graph "${defaultWord}" not found`
            );
            return;
        }

        word.classList.add("selected");

        const container =
            document.createElement("div");

        container.className =
            "graph-container";

        sentence.appendChild(container);

        drawBarPlot(
            graph,
            container
        );

    });

    </script>


</body>
